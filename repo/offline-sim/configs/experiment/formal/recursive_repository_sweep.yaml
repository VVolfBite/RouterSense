version: 1
name: current_p12_recursive_repository_sweep
# The sweep CLI replaces this placeholder with every --trace-root argument.
traces:
- .
simulation:
  release_mode: RANK_LOCAL
  p0_p1_compute_end_barrier: true
  staging: 1.0X
  max_task_bytes: 262144
  max_window_prefix_tasks: 256
  alignment_bytes: 256
  max_timestamps: 2000000
  runtime_profile: ../../profiles/current_p12_synthetic_runtime.json
experiments:
  treatments:
  - name: FIFO-Local
    algorithm: local(global_(fifo()))
    information: zero
    overlap: overlap
    experiment_role: PAPER_BASELINE
    release_mode: PHASE_BARRIER
  - name: BvN-Local
    algorithm: local(global_(birkhoff()))
    information: zero
    overlap: overlap
    experiment_role: PAPER_BASELINE
    release_mode: PHASE_BARRIER
  - name: RSCF-Local
    algorithm: local(global_(rscf()))
    information: zero
    overlap: overlap
    experiment_role: RELEASEFRONTIER_MAIN
    release_mode: PHASE_BARRIER
  - name: RSCF-Joint-FATE
    algorithm: joint(global_(rscf()))
    information: fate
    overlap: overlap
    experiment_role: RELEASEFRONTIER_MAIN
    release_mode: RANK_LOCAL
  - name: RSCF-Joint-Perfect
    algorithm: joint(global_(rscf()))
    information: perfect
    overlap: overlap
    experiment_role: DIAGNOSTIC_REFERENCE
    release_mode: RANK_LOCAL
  - name: Oracle-Local
    algorithm: local(global_(oracle()))
    information: zero
    overlap: overlap
    experiment_role: ORACLE_REFERENCE
    release_mode: PHASE_BARRIER
  - name: Oracle-Joint
    algorithm: joint(global_(oracle()))
    information: perfect
    overlap: overlap
    experiment_role: ORACLE_REFERENCE
    release_mode: RANK_LOCAL
repetitions:
  warmup: 0
  measure: 1
  seed: 20260801
oracle:
  time_limit_ms_per_window: 2000
  relative_gap: 0.03
  require_all_certified: false
execution:
  mode: INPROCESS_DURABLE
  per_run_timeout_seconds: 600
  kill_grace_seconds: 5
  fail_fast: false
comparison:
  # Paper execution semantics are fixed above. Claim mode remains diagnostic
  # until the selected RuntimeProfileBundle is hardware-calibrated.
  claim_mode: DIAGNOSTIC
  baseline: FIFO-Local
  primary_metric: compute_excluded_communication_makespan_ns_sum
  target_improvement_percent: 0.0
  tie_tolerance_percent: 0.05
  minimum_paired_samples: 3
output:
  directory: ./recursive_repository_sweep_output
  complete_csv_filename: formal_results.csv
  save_raw_events: false
  save_task_timeline: false
  save_plans: false
  raw_only: true
  overwrite: false
