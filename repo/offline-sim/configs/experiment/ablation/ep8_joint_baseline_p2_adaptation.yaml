    release_mode: RANK_LOCAL
    allow_matched_joint_diagnostic: true
repetitions:
  warmup: 0
  measure: 1
  seed: 20260801
oracle:
  time_limit_ms_per_window: 1000
  relative_gap: 0.05
  require_all_certified: false
execution:
  mode: SUBPROCESS_ISOLATED
  per_run_timeout_seconds: 120
  kill_grace_seconds: 5
  fail_fast: false
comparison:
  claim_mode: DIAGNOSTIC
  baseline: Greedy-Local
  primary_metric: compute_excluded_communication_makespan_ns_sum
  target_improvement_percent: 0.0
  tie_tolerance_percent: 0.05
  minimum_paired_samples: 3
output:
  directory: /results/experiments/current_p12_ep8_joint_baseline_p2_adaptation
  save_raw_events: false
  save_task_timeline: false
  save_plans: true
  overwrite: false
