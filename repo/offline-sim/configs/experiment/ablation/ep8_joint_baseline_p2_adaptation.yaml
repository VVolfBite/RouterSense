version: 1
name: current_p12_ep8_joint_baseline_p2_adaptation
traces:
- /results/traces/RouterSense_FATE_Trace_Repository/measured/EP8
simulation:
  release_mode: RANK_LOCAL
  p0_p1_compute_end_barrier: true
  staging: 1.0X
  max_task_bytes: 262144
  max_window_prefix_tasks: 256
  alignment_bytes: 256
  max_timestamps: 2000000
  runtime_profile: ../../profiles/current_p12_synthetic_runtime.json
experiments:
  treatments:
  - name: Greedy-Local
    algorithm: local(global_(greedy()))
    information: zero
    overlap: overlap
    experiment_role: DIAGNOSTIC_BASELINE
    release_mode: PHASE_BARRIER
  - name: Greedy-Joint-FATE
    algorithm: joint(global_(greedy()))
    information: fate
    overlap: overlap
    experiment_role: EXPLICIT_DIAGNOSTIC_ABLATION
    release_mode: RANK_LOCAL
    allow_matched_joint_diagnostic: true
  - name: Birkhoff-Local
    algorithm: local(global_(birkhoff()))
    information: zero
    overlap: overlap
    experiment_role: DIAGNOSTIC_BASELINE
    release_mode: PHASE_BARRIER
