version: 1
name: current_p12_ep4_fate_smoke
traces:
- /results/traces/olmoe_ep4_fate/trace_manifest.json
simulation:
  release_mode: RANK_LOCAL
  p0_p1_compute_end_barrier: true
  staging: 1.0X
  max_task_bytes: 262144
  max_window_prefix_tasks: 64
  alignment_bytes: 256
  max_timestamps: 300000
  runtime_profile: ../../profiles/current_p12_synthetic_runtime.json
experiments:
  treatments:
  - name: FIFO-Local
    algorithm: local(global_(fifo()))
    information: zero
    overlap: overlap
    experiment_role: PAPER_BASELINE
    release_mode: PHASE_BARRIER
  - name: BvN-Local
    algorithm: local(global_(birkhoff()))
    information: zero
    overlap: overlap
    experiment_role: PAPER_BASELINE
    release_mode: PHASE_BARRIER
  - name: RSCF-Local
    algorithm: local(global_(rscf()))
    information: zero
    overlap: overlap
    experiment_role: RELEASEFRONTIER_MAIN
    release_mode: PHASE_BARRIER
  - name: RSCF-Joint-FATE
    algorithm: joint(global_(rscf()))
    information: fate
    overlap: overlap
    experiment_role: RELEASEFRONTIER_MAIN
    release_mode: RANK_LOCAL
repetitions:
  warmup: 0
  measure: 1
  seed: 1234
execution:
  mode: SUBPROCESS_ISOLATED
  per_run_timeout_seconds: 120
  kill_grace_seconds: 5
  fail_fast: true
comparison:
  claim_mode: DIAGNOSTIC
  baseline: FIFO-Local
  primary_metric: compute_excluded_communication_makespan_ns_sum
  target_improvement_percent: 0.0
  tie_tolerance_percent: 0.05
  minimum_paired_samples: 1
output:
  directory: /results/experiments/current_p12_ep4_fate_smoke
  save_raw_events: false
  save_task_timeline: false
  save_plans: false
  overwrite: true
