schema_version: 1
run:
  kind: offline_replay
  name: offline_replay_smoke
model: {}
topology: {}
workload: {}
runtime:
  line: offline_replay
traffic:
  matrix_unit: rows
  bucket_rows:
    - 128
    - 512
    - 1024
policy:
  names:
    - fifo_bucket
    - greedy_bucket
    - islip_bucket
    - birkhoff_bucket_phase_local
    - current:p012:local:event:rscf
    - current:p012:joint:event:rscf
prediction:
  names:
    - zero_hint
    - copy_current_dispatch
    - perfect_trace_hint
evaluation:
  max_windows: 2
  metrics:
    - makespan
    - plan_digest
replay:
  fixture_dir: tests/fixtures/offline_replay_smoke
  output_dir: outputs/offline/offline_replay_smoke
  scheduling_mode: execution_window
  expert_compute_delay: 0.0
oracle: {}
regime_analysis: {}
