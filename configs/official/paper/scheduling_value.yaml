schema_version: paper_eval_config.v1
claim_scope: scheduling_value
models:
  model_id: replay_fixture_proxy
  model_revision: frozen-clone
inputs:
  source: tests/fixtures/offline_replay_smoke
layers: [1, 2]
virtual_ep_sizes: [2, 4]
physical_world_size: 1
policies:
  - birkhoff_von_neumann_fluid
  - exact_small_instance_reference
  - B_birkhoff
  - U_barrier_criticality_global_matching
predictors: []
cost_model: formal_replay_makespan
seeds:
  default: 0
splits:
  development: [synthetic]
  validation: [synthetic]
  frozen_evaluation: [offline_replay_smoke]
measurement:
  mode: offline
eligibility:
  runtime_performance: false
output:
  dir: outputs/paper
