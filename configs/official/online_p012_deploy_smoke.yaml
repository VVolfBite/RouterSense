schema_version: 1
run:
  kind: online_strategy_comparison
  name: online_p012_deploy_smoke
model:
  path: configs/components/models/olmoe_1b_7b_instruct.yaml
topology:
  ep_size: 4
  component: configs/components/topologies/local_4gpu.yaml
workload:
  prompts: configs/components/workloads/bringup_2_short_prompts.json
runtime:
  line: async_release
  invariant_mode: evaluation_strict
  output_mode: debug_replay
  precision: fp16
  dispatcher: alltoall
  selected_layers: 0,1
traffic:
  matrix_unit: rows
  bucket_mode: dynamic_current
  bucket_rows: 0
policy:
  options:
    p0_weight: 1.0
    p1_reservation_weight: 1.0
    p2_hint_weight: 1.0
    residual_weight: 0.75
    barrier_weight: 1.75
    age_weight: 0.15
    prediction_weight: 0.35
    safe_projection_mode: host_select
prediction:
  name: bridge_copy_current
  config: {}
evaluation:
  repeats: 1
  warmup: 0
  selected_layer_ids:
    - 0
    - 1
  metrics: []
  baseline_strategy: birkhoff_phase_local_async_p2p
  phase_selector: both
replay: {}
oracle: {}
regime_analysis: {}
strategies:
  - name: birkhoff_phase_local_async_p2p
  - name: routersense_current_p012_local_event_rscf_async
  - name: routersense_current_p012_joint_event_rscf_async
  - name: routersense_current_p012_local_global_rscf_async
  - name: routersense_current_p012_joint_global_rscf_async
  - name: routersense_future_p012_local_global_rscf_async
  - name: routersense_future_p012_joint_global_rscf_async
  - name: routersense_current_p0123_local_global_rscf_async
  - name: routersense_current_p0123_joint_global_rscf_async
