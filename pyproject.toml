[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rs"
version = "0.2.0"
description = "RouteSense: dependency-aware release scheduling for distributed MoE inference."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gpu = [
  "torch",
  "transformers",
  "accelerate",
  "safetensors"
]
dev = [
  "pytest",
  "numpy",
  "pyyaml"
]
solver = [
  "ortools"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--ignore=tests/legacy -m \"not legacy and not gpu and not nccl and not multinode and not slow\""
markers = [
  "gpu: requires at least one visible GPU",
  "nccl: requires distributed NCCL execution",
  "multinode: requires multi-node environment",
  "slow: long-running regression or reference solver coverage",
  "solver: requires the optional OR-Tools solver dependency",
  "legacy: historical POC or deprecated-path coverage excluded from the default suite",
]
