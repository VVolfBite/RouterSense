model:
  path: /root/autodl-tmp/models/OLMoE-1B-7B-0924
  trust_remote_code: false

topology:
  ep_size: 4
  launcher:
    kind: torchrun

runtime:
  line: phase_sync
  output_mode: debug_replay
  precision: fp16
  dispatcher: alltoall

workload:
  prompts: configs/workload/comparison_smoke_prompt.json

validation:
  save_logits: false
  stop_after_selected_layer: false

strategies:
  - name: routersense_p0p1p2_hint

execution:
  repetitions: 1
  p0_weight: 1.0
  p1_reservation_weight: 1.0
  p2_hint_weight: 1.0
  schedule_layer_selector: all
  schedule_phase_selector: both

comparison:
  baseline_strategy: routersense_p0p1p2_hint
  primary_metric: communication_makespan_us
