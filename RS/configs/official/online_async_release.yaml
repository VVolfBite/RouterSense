schema_version: 1
run:
  kind: online_strategy_comparison
  name: online_async_release
model:
  path: configs/components/models/olmoe_1b_7b_instruct.yaml
topology:
  ep_size: 4
  component: configs/components/topologies/local_4gpu.yaml
workload:
  prompts: configs/components/workloads/comparison_64_prompts.json
runtime:
  line: async_release
  invariant_mode: evaluation_strict
  output_mode: paper
  precision: fp16
  dispatcher: alltoall
  selected_layers: selected
traffic:
  matrix_unit: rows
  bucket_mode: dynamic_current
  bucket_rows: 0
policy:
  options:
    p0_weight: 1.0
    p1_reservation_weight: 1.0
    p2_hint_weight: 1.0
    residual_weight: 0.75
    barrier_weight: 1.75
    age_weight: 0.15
    prediction_weight: 0.35
    safe_projection_mode: host_select
prediction: {}
evaluation:
  repeats: 1
  warmup: 0
  metrics: []
  baseline_strategy: fifo_async_p2p
  phase_selector: both
replay: {}
oracle: {}
regime_analysis: {}
strategies:
  - name: fifo_async_p2p
  - name: greedy_async_p2p
  - name: birkhoff_phase_local_async_p2p
  - name: routersense_joint_zero_raw_async
  - name: routersense_joint_predicted_raw_async
  - name: routersense_joint_zero_safe_async
  - name: routersense_joint_predicted_safe_async
