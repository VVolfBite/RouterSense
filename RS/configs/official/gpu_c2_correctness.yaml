schema_version: 1
run:
  kind: gpu_validation
  name: c2_correctness
model:
  path: configs/components/models/olmoe_1b_7b_instruct.yaml
topology:
  world_size: 4
  component: configs/components/topologies/local_4gpu.yaml
workload:
  prompts: configs/components/workloads/comparison_64_prompts.json
runtime:
  line: async_release
  invariant_mode: evaluation_strict
traffic:
  matrix_unit: rows
  bucket_rows:
    - 512
    - 1024
    - 2048
policy: {}
prediction: {}
evaluation:
  repeats: 2
  warmup: 0
  metrics:
    - output_parity
    - nan_inf
replay: {}
oracle: {}
regime_analysis: {}
suite: c2
reference_strategy: birkhoff_phase_local_sync
candidate_strategy: routersense_joint_predicted_async_p2p
selected_layers: selected
forward_epochs: 2
profile: execution
preflight_mode: full
coalescing_enabled: false
require_output_parity: true
require_no_fallback: true
