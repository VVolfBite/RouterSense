schema_version: 1
run:
  kind: gpu_validation
  name: a2_performance
model:
  path: configs/components/models/olmoe_1b_7b_instruct.yaml
topology:
  world_size: 4
  component: configs/components/topologies/local_4gpu.yaml
workload:
  prompts: configs/components/workloads/comparison_64_prompts.json
runtime:
  line: async_release
  invariant_mode: evaluation_strict
traffic:
  matrix_unit: rows
  bucket_mode: dynamic_current
  bucket_rows: 0
  calibration_bucket_rows:
    - 512
    - 1024
    - 2048
policy: {}
prediction: {}
evaluation:
  repeats: 10
  warmup: 3
  metrics:
    - backend_gain
    - joint_gain
    - prediction_gain
    - safe_u_net_benefit
    - rank_early_release_gain
replay: {}
oracle: {}
regime_analysis: {}
suite: a2
world_size: 4
profile: perf
preflight_mode: compact
selected_layers: selected
strategies:
  - native
  - fifo_async_p2p
  - greedy_async_p2p
  - birkhoff_phase_local_sync
  - birkhoff_phase_local_async_p2p
  - routersense_joint_phase_sync
  - routersense_joint_zero_raw_async
  - routersense_joint_predicted_raw_async
  - routersense_joint_zero_safe_async
  - routersense_joint_predicted_safe_async
