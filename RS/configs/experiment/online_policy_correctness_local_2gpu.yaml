run:
  kind: online_policy_correctness
  name: online-policy-correctness-local-2gpu
model:
  config: configs/model/olmoe_1b_7b_instruct.yaml
topology:
  config: configs/topology/local_2gpu.yaml
workload:
  prompts: configs/workload/smoke_prompts.json
runtime:
  precision: fp16
  dispatcher: alltoall
  control_mode: sync_before_phase
policy:
  name: bucketed_fifo
  p0_weight: 1.0
  p1_reservation_weight: 1.0
  p2_hint_weight: 0.0
  p2_hint_mode: none
execution:
  mode: phase_sync_wave
  bucket_rows: 0
  schedule:
    layer_selector: all
    phase_selector: both
observation:
  profile: execution
  capture:
    enabled: false
    layer_selector: ""
    phase_selector: ""
validation:
  save_logits: true
  stop_after_selected_layer: false
artifact:
  output_root: artifacts/megatron_ep/phase_executor
