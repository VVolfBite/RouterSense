run:
  kind: online_observe
  name: online-observe-local-4gpu-execution
model:
  config: configs/model/olmoe_1b_7b_instruct.yaml
topology:
  config: configs/topology/local_4gpu.yaml
workload:
  prompts: configs/workload/comparison_64_long_prompts.json
runtime:
  precision: fp16
  dispatcher: alltoall
  control_mode: none
online_policy:
  name: disabled
offline_study:
  policies: []
execution:
  mode: native_passthrough
observation:
  profile: execution
  capture_enabled: false
  capture_layer_selector: ""
  capture_phase_selector: ""
  heartbeat_enabled: false
  per_wave_timing_enabled: false
validation:
  save_logits: false
  stop_after_selected_layer: false
artifact:
  artifact_root: artifacts/megatron_ep/formal_disabled
