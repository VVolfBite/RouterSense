schema_version: 1
run:
  kind: online_strategy_comparison
  name: online_async_release
model:
  path: configs/model/olmoe_1b_7b_instruct.yaml
topology:
  ep_size: 4
workload:
  prompts: configs/workload/comparison_64_prompts.json
runtime:
  line: async_release
  output_mode: paper
  precision: fp16
  dispatcher: alltoall
  selected_layers: selected
traffic:
  matrix_unit: rows
  bucket_rows: 1024
policy:
  options:
    p0_weight: 1.0
    p1_reservation_weight: 1.0
    p2_hint_weight: 1.0
prediction: {}
evaluation:
  repeats: 1
  warmup: 0
  metrics: []
  baseline_strategy: fifo_async_p2p
  phase_selector: both
replay: {}
oracle: {}
regime_analysis: {}
strategies:
  - name: fifo_async_p2p
  - name: greedy_async_p2p
  - name: birkhoff_phase_local_async_p2p
  - name: routersense_joint_zero_hint_async_p2p
  - name: routersense_joint_predicted_async_p2p
  - name: routersense_safe_joint_async
